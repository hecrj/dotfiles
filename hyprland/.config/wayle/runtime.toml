[general]
font-sans = "Hasklug Nerd Font Mono"
font-mono = "Hasklug Nerd Font Mono"

[bar]
scale = 0.75
padding = 0.0
padding-ends = 0.0
location = "bottom"
bg = "#000000"
button-variant = "basic"
button-bg-opacity = 0
button-icon-size = 0.75
button-label-weight = "normal"
button-rounding = "none"
button-group-background = "bg-surface-elevated"

[[bar.layout]]
monitor = "*"
show = true
left = ["hyprland-workspaces"]
center = ["window-title"]
right = [
    "cpu",
    "ram",
    "storage",
    "netstat",
    "volume",
    "clock",
    "systray",
]

[styling]
scale = 1.0

[styling.palette]
bg = "#11111b"
surface = "#181825"
elevated = "#1e1e2e"
fg = "#cdd6f4"
fg-muted = "#bac2de"
primary = "#b4befe"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#74c7ec"

[modules.cpu]
zero-pad = false

[modules.hyprland-workspaces]
show-special = false
label-use-name = true
divider = ""
app-icons-show = true
app-icons-empty-show = false
icon-gap = 0.25
label-icon-gap = 0.25
icon-size = 0.5
line-height = 0.5
active-indicator = "underline"
container-bg-color = "transparent"

[modules.netstat]
poll-interval-ms = 5000
compact-units = true

[modules.ram]
zero-pad = false

[modules.volume]
icon-color = "fg-default"
label-color = "fg-default"

[modules.window-title]
icon-color = "fg-default"
icon-bg-color = "transparent"
label-color = "fg-default"
label-max-length = 100
button-bg-color = "transparent"

[wallpaper]
engine-enabled = false
